version: '3.8'

# ─────────────────────────────────────────────────────────────────────────────
# ZeroMesh-UPI: Complete Distributed Payment System
#
# Start everything:  docker compose up --build
# Stop everything:   docker compose down
# Fresh restart:     docker compose down -v && docker compose up --build
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL Database ────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: zeromesh-postgres
    environment:
      POSTGRES_DB:       zeromeshdb
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (Distributed Lock & Idempotency) ─────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: zeromesh-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Apache Kafka (KRaft Mode — No ZooKeeper!) ──────────────────────────────
  kafka:
    image: apache/kafka:3.7.0
    container_name: zeromesh-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9094'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9094'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      CLUSTER_ID: 'ZeroMeshKRaftClusterId01'
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── Ingestion Service: Edge API Gateway (Port 8080) ───────────────────────
  ingestion-service:
    build:
      context: .
      dockerfile: ingestion-service/Dockerfile
    container_name: zeromesh-ingestion
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    volumes:
      # Shared RSA key pair volume — same keys for both services!
      - zeromesh-keys:/app/zeromesh-keys
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: on-failure

  # ── Settlement Service: Core Worker Engine (Port 8081) ────────────────────
  settlement-service:
    build:
      context: .
      dockerfile: settlement-service/Dockerfile
    container_name: zeromesh-settlement
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    volumes:
      # Same shared volume — loads RSA keys created by ingestion-service
      - zeromesh-keys:/app/zeromesh-keys
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      ingestion-service:
        condition: service_started
    restart: on-failure

# ─────────────────────────────────────────────────────────────────────────────
volumes:
  postgres-data:    # Persistent PostgreSQL data (survives docker compose down)
  zeromesh-keys:    # Shared RSA key pair between ingestion and settlement
